name: LINAD checks and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Approved geometry fixtures use Windows fonts and the Chrome channel.
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      CI: 'true'
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate public configuration
        run: node tools/check-public-env.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Install test browser
        run: npx playwright install chrome
      - name: Provision sockets for the complete browser suite
        shell: pwsh
        run: |
          # Hundreds of isolated contexts create many localhost connections.
          # Hosted Windows otherwise can return net::ERR_NO_BUFFER_SPACE.
          # This changes only the disposable CI VM, never a developer machine.
          netsh int ipv4 set dynamicport tcp start=1025 num=64511
          if ($LASTEXITCODE -ne 0) { throw 'Could not provision IPv4 client ports' }
          netsh int ipv6 set dynamicport tcp start=1025 num=64511
          if ($LASTEXITCODE -ne 0) { throw 'Could not provision IPv6 client ports' }
          netsh int ipv4 show dynamicport tcp
          netsh int ipv6 show dynamicport tcp
      - name: Run the complete test suite
        run: npm test
      - name: Retain test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Package only the production site
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_PUBLISH_ENABLED == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    # Disabled until the owner explicitly enables publication in repository Variables.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_PUBLISH_ENABLED == 'true' }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
